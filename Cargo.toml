[package]
name = "ownclips"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
windows-capture = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = "0.25"
wasapi = "0.26"
chrono = "0.4"
ctrlc = "3"
# League's local Live Client Data API (HTTPS with a self-signed certificate).
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }

[workspace]
members = ["app/src-tauri"]
